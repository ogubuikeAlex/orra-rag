[project]
name = "orra-rag"
version = "0.1.0"
description = "Hybrid RAG FastAPI service for ORRA docs and FAQs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lancedb>=0.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
orra-rag = "orra_rag.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orra_rag"]

[tool.uv]
package = true
